name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The protobuf bindings in src/lib/gen are committed. Regenerate them and
      # fail if anything changed, so a .proto edit can't land without the
      # matching `npm run gen:proto`. --porcelain catches added/removed files,
      # not just modified ones.
      - name: Check generated protobuf is up to date
        run: |
          npm run gen:proto
          if [ -n "$(git status --porcelain -- src/lib/gen)" ]; then
            echo "::error::src/lib/gen is stale — run 'npm run gen:proto' and commit the result"
            git status --porcelain -- src/lib/gen
            git diff -- src/lib/gen
            exit 1
          fi

      - name: Run tests
        run: npm run tests

      - name: Build static site
        run: npm run build

      # Disable Jekyll so paths beginning with an underscore (_next) are served.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
